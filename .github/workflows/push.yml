name: Push

on: 
  push:
    branches:
      - master

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: psf/black@stable
        with:
          options: ". -l 79 --check"
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.7"
      - name: Install dependencies
        run: make install
      - name: Run the main tests
        run: make test
  publish:
    name: Deploy
    if: github.repository == 'PolicyEngine/openfisca-tools'
    runs-on: ubuntu-22.04
    # PyPI trusted publishing: uploads accepted only from this workflow in the
    # pypi environment (limited to master). No stored token.
    environment: pypi
    permissions:
      contents: write # publish-git-tag.sh pushes the version tag
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.7"
      - name: Publish a git tag
        run: ".github/publish-git-tag.sh"
      - name: Install dependencies
        run: make install
      - name: Run tests
        run: make test
      # Build on a current Python: the newest setuptools available on 3.7
      # writes unnormalized filenames (OpenFisca_Tools-...), which PyPI
      # rejects. The package itself still installs and tests on 3.7.
      - name: Set up Python for building
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install build
          python -m build
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
          packages_dir: dist/
